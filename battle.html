<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8ecf4;font-family:-apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;margin:0 auto}
/* top question bar */
#qpanel{position:fixed;top:0;left:0;right:0;z-index:2;background:#0f1629;border-bottom:1px solid #ffffff14;padding:10px 18px 8px}
#qpanel .row{display:flex;align-items:center;gap:14px}
#lvchip{flex:none;font-size:.8rem;font-weight:800;letter-spacing:.06em;color:#f5b544;background:#f5b5441a;border:1px solid #f5b54455;border-radius:999px;padding:4px 10px}
#qtext{flex:1;font-size:1.25rem;font-weight:750;line-height:1.3;text-align:center}
#timer{flex:none;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;background:#ffffff10;border-radius:10px;padding:5px 12px;min-width:64px;text-align:center}

.ch i{font-style:normal;flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:900;color:#fff}
#msg{font-size:.92rem;color:#aab3c5;text-align:center;margin-top:6px;min-height:1.2em}
/* overlays */
#menu{position:fixed;inset:0;background:#0b1020;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.card{background:#111a30;border:1px solid #ffffff14;border-radius:20px;padding:26px 30px;box-shadow:0 20px 60px #0008}
.btn{background:#f5b544;border:none;color:#1a1306;font-weight:850;font-size:1.05rem;padding:12px 22px;border-radius:12px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:#ffffff12;color:#e8ecf4}.btn.on{background:#41b86a;color:#fff}
.seg{display:inline-flex;background:#ffffff0d;border-radius:12px;padding:4px;gap:4px}.seg .btn{padding:8px 16px;font-size:.95rem}
h1,h2,h3{margin:0}.muted{color:#93a0b8}
table{border-collapse:collapse}td,th{padding:6px 12px;border-bottom:1px solid #ffffff12;text-align:left}
a{color:#7fc8ff}
kbd{background:#ffffff18;border:1px solid #ffffff22;border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-weight:800;font-size:.85rem}
#dim{position:fixed;inset:0;background:#05080fd9;z-index:3;display:none}
#reveal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:90vh;overflow:auto;background:#fbf8f2;color:#1b2030;border-radius:18px;padding:26px 30px;z-index:4;display:none;box-shadow:0 24px 70px #000;font-size:1.15rem;line-height:1.5}
#reveal h2{margin:0 0 12px;font-size:1.6rem}
#reveal .lbl{font-size:.78rem;font-weight:850;color:#7a8094;text-transform:uppercase;letter-spacing:.07em;margin-top:14px}
#reveal .q{font-weight:700}
#reveal .ans{font-size:1.5rem;font-weight:900;background:#dcf5e5;color:#0f5a2c;border:2px solid #41b86a;border-radius:12px;padding:10px 16px;margin:4px 0}
#reveal .bad{background:#fde3e3;color:#8a1a1a;border-color:#e2403a}
#reveal .verb{background:#eef0fb;border-radius:10px;padding:8px 14px;margin:6px 0}
#reveal .x{position:sticky;float:right;top:0;background:#1b2030;color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.2rem;font-weight:900;cursor:pointer}
#reveal .go{background:#41b86a;color:#fff;border:none;font-size:1.2rem;font-weight:850;padding:13px 28px;border-radius:12px;cursor:pointer;margin-top:18px}
#reveal .opt{display:block;width:100%;text-align:left;border:none;border-radius:10px;padding:9px 14px;margin:6px 0;color:#fff;font-weight:700;font-size:1.1rem}

#reveal input:focus{outline:none;border-color:#f5b544}
mark{background:#ffe08a;color:#1b2030;border-radius:5px;padding:0 5px;font-weight:900}
.tag{border-radius:6px;padding:1px 8px;font-weight:800;font-size:.8rem;color:#fff;white-space:nowrap}
.pret{background:#d9661a}.imp{background:#2f6fd1}.pas{background:#8a4fd8}.pres{background:#1e9a55}.pp{background:#0e8f9a}.plu{background:#8a5a2b}.oth{background:#777}
.chip{display:inline-block;background:#eef3ff;border:1px solid #c9d6f5;border-radius:999px;padding:3px 12px;margin:3px;font-size:.95rem}

.mx{display:block}.mx .land{fill:#1d2a4a;stroke:#6f86c4;stroke-width:1.5}

.lvbtn b{flex:none;width:28px;height:28px;border-radius:50%;background:#f5b544;color:#1a1306;display:grid;place-items:center}

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720,FPS=60,G=670;
function fit(){const top=document.getElementById('qpanel').offsetHeight;const s=Math.min(innerWidth/W,(innerHeight-top)/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.marginTop=top+'px'}
addEventListener('resize',fit);
const COLORS=['#e2403a','#2f7de1','#1ea05a','#d9661a'],LET=['A','B','C','D'];
const LOCK=10*FPS,RESPAWN=3*FPS,QTIME=40*FPS;
const PDEF=[
 {name:'P1',color:'#ffd23f',dark:'#a8800f',keys:{l:'KeyA',r:'KeyD',j:'KeyW',f:'KeyS'},label:'<kbd>W</kbd> jump · <kbd>A</kbd><kbd>D</kbd> move · <kbd>S</kbd> shoot'},
 {name:'P2',color:'#4ff0ff',dark:'#14889b',keys:{l:'ArrowLeft',r:'ArrowRight',j:'ArrowUp',f:'ArrowDown'},label:'<kbd>↑</kbd> jump · <kbd>←</kbd><kbd>→</kbd> move · <kbd>↓</kbd> shoot'},
 {name:'P3',color:'#ff6bd6',dark:'#a3267f',keys:{l:'KeyJ',r:'KeyL',j:'KeyI',f:'KeyK'},label:'<kbd>I</kbd> jump · <kbd>J</kbd><kbd>L</kbd> move · <kbd>K</kbd> shoot'}];
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// =====================================================================
// CONJUGATION ENGINE: presente, pretérito, imperfecto, presente perfecto, pluscuamperfecto
// =====================================================================
const CVERBS=[['luchar','to fight'],['tomar','to take'],['quitar','to take away'],['planear','to plan'],['ocupar','to hold (a job)'],['liderar','to lead'],['trabajar','to work'],
 ['nacer','to be born'],['romper','to break'],['devolver','to give back'],['exigir','to demand'],['vivir','to live'],['escribir','to write'],['morir','to die'],['ser','to be'],['tener','to have']];
const PERS=['yo','tú','Zapata (él)','nosotros','los campesinos (ellos)'];
const TENSES={pres:{n:'presente',hint:'now / usually'},pret:{n:'pretérito',hint:'finished, happened once'},imp:{n:'imperfecto',hint:'was ___ing / used to'},
 pp:{n:'presente perfecto',hint:'have ___ed'},plu:{n:'pluscuamperfecto',hint:'had ___ed'}};
const RULES={
 pres:'-ar: o, as, a, amos, an · -er: o, es, e, emos, en · -ir: o, es, e, imos, en',
 pret:'-ar: é, aste, ó, amos, aron · -er/-ir: í, iste, ió, imos, ieron',
 imp:'-ar: aba, abas, aba, ábamos, aban · -er/-ir: ía, ías, ía, íamos, ían',
 pp:'he, has, ha, hemos, han + participle (-ar → -ado, -er/-ir → -ido)',
 plu:'había, habías, había, habíamos, habían + participle (-ado / -ido)'};
const IRR={
 ser:{pres:['soy','eres','es','somos','son'],pret:['fui','fuiste','fue','fuimos','fueron'],imp:['era','eras','era','éramos','eran']},
 tener:{pres:['tengo','tienes','tiene','tenemos','tienen'],pret:['tuve','tuviste','tuvo','tuvimos','tuvieron']},
 devolver:{pres:['devuelvo','devuelves','devuelve','devolvemos','devuelven']},
 nacer:{pres:['nazco','naces','nace','nacemos','nacen']},
 exigir:{pres:['exijo','exiges','exige','exigimos','exigen']},
 morir:{pres:['muero','mueres','muere','morimos','mueren'],pret:['morí','moriste','murió','morimos','murieron']}};
const IRRPART={romper:'roto',devolver:'devuelto',escribir:'escrito',morir:'muerto'};
const HABER={pp:['he','has','ha','hemos','han'],plu:['había','habías','había','habíamos','habían']};
const part=v=>IRRPART[v]||v.slice(0,-2)+(v.endsWith('ar')?'ado':'ido');
function conj(v,t){if(t==='pp'||t==='plu')return HABER[t].map(h=>h+' '+part(v));
 if(IRR[v]&&IRR[v][t])return IRR[v][t];const st=v.slice(0,-2),e=v.slice(-2);
 if(t==='pres')return e==='ar'?[st+'o',st+'as',st+'a',st+'amos',st+'an']:e==='er'?[st+'o',st+'es',st+'e',st+'emos',st+'en']:[st+'o',st+'es',st+'e',st+'imos',st+'en'];
 if(t==='pret')return e==='ar'?[st+'é',st+'aste',st+'ó',st+'amos',st+'aron']:[st+'í',st+'iste',st+'ió',st+'imos',st+'ieron'];
 return e==='ar'?[st+'aba',st+'abas',st+'aba',st+'ábamos',st+'aban']:[st+'ía',st+'ías',st+'ía',st+'íamos',st+'ían']}
function genConj(tenses){tenses=tenses||Object.keys(TENSES);const[v,mean]=CVERBS[Math.random()*CVERBS.length|0],t=tenses[Math.random()*tenses.length|0],pi=Math.random()*5|0;
 const forms=conj(v,t),right=forms[pi],T=TENSES[t];
 const cands=[...forms.filter(f=>f!==right),...Object.keys(TENSES).filter(x=>x!==t).map(x=>conj(v,x)[pi])].filter(f=>f!==right);
 const wrong=shuf([...new Set(cands)]).slice(0,3);
 const irr=(IRR[v]&&IRR[v][t])||((t==='pp'||t==='plu')&&IRRPART[v]);
 const ex=(irr?`<b>${v}</b> is irregular here, so you have to memorize it${IRRPART[v]&&(t==='pp'||t==='plu')?` (the participle is <b>${IRRPART[v]}</b>, not ${v.slice(0,-2)}ido)`:''}.`
   :`<b>${v}</b> is an -${v.slice(-2)} verb.`)+` The ${T.n} means "${T.hint}".<div class="small"><b>Rule:</b> ${RULES[t]}</div>`
   +`<div class="small"><b>All forms:</b> ${forms.map((f,i)=>`${PERS[i]}: ${i===pi?'<mark>'+f+'</mark>':f}`).join(' · ')}</div>`;
 return{v,mean,t,pi,right,q:`Conjuga ${v} (${mean}) para ${PERS[pi]} en el ${T.n}`,opts:[right,...wrong],a:0,ex,
  deep:[`Conjugate ${v} (${mean}) for ${PERS[pi]} in the ${T.n} (${T.hint})`,'',[[right,v,T.n,PERS[pi],T.hint]],[]]}}
// turn conjugation questions into normal orb questions
const conjQs=(tenses,n)=>Array.from({length:n},()=>{const g=genConj(tenses);return[g.q,g.opts,0,g.ex,g.deep]});

// =====================================================================
// WEAPONS: streak weapons + collectible guns
// =====================================================================
const WEAPONS=[
 {n:'Fireball',e:'🔥',need:0,cd:18,dmg:1,pdmg:25,kind:'ball'},
 {n:'Triple Shot',e:'🔱',need:2,cd:20,dmg:1,pdmg:20,kind:'triple'},
 {n:'Laser',e:'⚡',need:3,cd:14,dmg:3,pdmg:30,kind:'laser'},
 {n:'Homing Rockets',e:'🚀',need:5,cd:22,dmg:5,pdmg:35,kind:'rocket'}];
const GUNS={
 shotgun:{n:'Shotgun',e:'💥',ammo:8,cd:28,dmg:1,pdmg:12,kind:'shotgun',col:'#ffb12a'},
 boomerang:{n:'Sombrero Boomerang',e:'🥏',ammo:10,cd:30,dmg:2,pdmg:22,kind:'boom',col:'#e0bb5c'},
 bomb:{n:'Bombs',e:'💣',ammo:6,cd:34,dmg:4,pdmg:40,kind:'bomb',col:'#444'},
 sniper:{n:'Sniper',e:'🎯',ammo:5,cd:45,dmg:6,pdmg:50,kind:'snipe',col:'#7ad0ff'}};
const weaponOf=p=>WEAPONS.filter(w=>p.streak>=w.need).pop();
function fire(p){const x=p.x+p.w/2+p.face*22,y=p.y+22,f=p.face;let w;
 if(p.gun){w=p.gun;p.gun.ammo--;if(p.gun.ammo<=0){toast(`${p.name}: ${p.gun.n} is out of ammo`,'#aaa');p.gun=null}}
 else{if(p.ammo<=0)return;p.ammo--;w=weaponOf(p)}
 p.cd=w.cd;const S=o=>shots.push({x,y,vx:0,vy:0,o:p,l:90,w,...o});
 if(w.kind==='ball')S({vx:f*13});
 else if(w.kind==='triple')[-2.5,0,2.5].forEach(vy=>S({vx:f*13,vy}));
 else if(w.kind==='laser')S({vx:f*26,l:60,pierce:new Set()});
 else if(w.kind==='rocket'){S({y:y-8,vx:f*7,vy:-2,l:200,rocket:true});S({y:y+8,vx:f*7,vy:2,l:200,rocket:true})}
 else if(w.kind==='shotgun')for(let i=0;i<5;i++)S({vx:f*(12+Math.random()*2),vy:(i-2)*1.6,l:24,pellet:true});
 else if(w.kind==='boom')S({vx:f*13,dir:f,l:140,boom:true,pierce:new Set()});
 else if(w.kind==='bomb')S({vx:f*7+p.vx*.5,vy:-9,l:180,bomb:true});
 else if(w.kind==='snipe')S({vx:f*36,l:50,snipe:true,pierce:new Set()})}

const LEVELS=[
{name:'Anenecuilco',tag:'Nivel 1',map:{lat:18.77,lon:-98.98,mor:1},theme:'day',

{name:'La Hacienda',tag:'Nivel 2',map:{lat:18.81,lon:-98.95,mor:2},theme:'sunset',
 sub:'The rich landowner\'s ranch. NEW: a spike pit, spiked edges, two launch pads, and the Sombrero Boomerang.',

 spikes:[[480,720,320],[90,520,50],[1140,520,50],[520,160,40],[720,160,40]],pads:[[400,G,44],[860,G,44]],guns:[[560,375,'boomerang']],
 mobs:[{t:'w',y:400,min:480,max:800,s:1.4},{t:'w',y:G,min:900,max:1100,s:1.6}],
 orbs:[[230,475],[1050,475],[640,355],[225,225],[1055,225],[640,115]],spawns:[[60,600],[1180,600],[300,600]]},
{name:'El Plan de Ayala',tag:'Nivel 3',map:{lat:18.76,lon:-98.98,mor:3},theme:'dusk',
 sub:'Where Zapata\'s plan was signed. NEW: packet questions in Spanish, plus CONJUGATION questions (presente + pretérito), a moving platform, a saw, buzzards, and bombs.',

// ---- Level 6: underground mines (dark, lava, falling rocks, typed chests) ----

function makeBG(theme){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),s=THEMES[theme];
 const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,s[0]);sky.addColorStop(.55,s[1]);sky.addColorStop(1,s[2]);g.fillStyle=sky;g.fillRect(0,0,W,H);

  for(let i=0;i<26;i++){const x=Math.random()*W,y=100+Math.random()*500,col=['#7ad0ff','#c47aff','#5fffb0'][i%3];g.fillStyle=col+'88';g.beginPath();g.moveTo(x,y);g.lineTo(x+6,y-18);g.lineTo(x+12,y);g.fill()}
  return c}
 if(theme!=='day')for(let i=0;i<(theme==='night'?140:60);i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.8})`;g.fillRect(Math.random()*W,Math.random()*300,2,2)}

 const mtn=(col,base,amp,seed)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,base-Math.abs(Math.sin(x/170*Math.PI/Math.PI+seed))*amp-Math.sin(x/53+seed*3)*amp*.15);g.lineTo(W,H);g.fill()};
 const dk=theme==='day'?['#5a8a6a','#3f6e50','#2d5a3c']:theme==='night'?['#1a1030','#120a22','#0a0614']:['#6b3a7a','#4a2a5e','#2f1d42'];

 const bubPos=(k)=>[bub[0]-60+k*40,bub[1]+(k%2?14:-14)];
 let s=`<svg class="mx" viewBox="0 0 680 430" width="100%"><polygon class="land" points="${pts}"/>`;
 s+=`<text x="${proj(-106.1,28.6)[0]}" y="${proj(-106.1,28.6)[1]}" font-size="13" fill="#93a0b8" text-anchor="middle">🐎 Villa · NORTE</text>`;
 s+=`<circle cx="${mor[0]}" cy="${mor[1]}" r="9" fill="none" stroke="#f5b544" stroke-width="2"/><line x1="${mor[0]+8}" y1="${mor[1]+5}" x2="${bub[0]-80}" y2="${bub[1]-10}" stroke="#f5b544" stroke-dasharray="4 4"/>`;
 s+=`<rect x="${bub[0]-90}" y="${bub[1]-42}" width="180" height="84" rx="16" fill="#111a30" stroke="#f5b544"/><text x="${bub[0]}" y="${bub[1]+34}" font-size="11" fill="#f5b544" text-anchor="middle">MORELOS · Zapata · SUR</text>`;
 morPins.forEach(([L,i],k)=>{const[x,y]=bubPos(k);s+=`<g class="pin" onclick="start(${i})"><circle class="dot" cx="${x}" cy="${y-6}" r="13" fill="#f5b544"/><text x="${x}" y="${y-1}" font-size="13" fill="#1a1306" text-anchor="middle" style="fill:#1a1306">${i+1}</text></g>`});
 LEVELS.forEach((L,i)=>{if(L.map.mor)return;const[x,y]=route[i];s+=`<g class="pin" onclick="start(${i})"><circle cx="${x}" cy="${y}" r="20" fill="#f5b54433"/><circle class="dot" cx="${x}" cy="${y}" r="13" fill="#f5b544"/><text x="${x}" y="${y+5}" font-size="13" text-anchor="middle" style="fill:#1a1306">${i+1}</text><text x="${x+18}" y="${y-14}" font-size="12">${L.name}</text></g>`});
 return s+'</svg>'}

const norm=w=>w.toLowerCase().replace(/^[¿¡"'(]+|[?!.,;:"')…]+$/g,'');
function wrap(text,hlset){hlset=hlset||new Set();return String(text).split(/(\s+)/).map(t=>{if(!/[a-záéíóúñü]/i.test(t)||t.includes('<'))return t;const n=norm(t);return`<span class="w${hlset.has(n)?' hlw':''}" data-w="${n.replace(/"/g,'')}">${t}</span>`}).join('')}
const tip=$('tip'),cache={};
document.addEventListener('click',async e=>{const t=e.target.closest&&e.target.closest('.w');if(!t){tip.style.display='none';return}
 const w=t.dataset.w;tip.style.left=Math.min(e.clientX+10,innerWidth-340)+'px';tip.style.top=(e.clientY+16)+'px';tip.style.display='block';
 let tr=GLOSS[w]||cache[w];if(!tr&&/^\d+$/.test(w))tr='the number '+w;
 if(!tr){const cv=CVERBS.find(([v])=>Object.keys(TENSES).some(t=>conj(v,t).some(f=>f.split(' ').includes(w))));if(cv)tr=`a form of ${cv[0]} (${cv[1]})`}
 if(!tr&&['he','has','ha','hemos','han','había','habías','habíamos','habían'].includes(w))tr='a form of haber (have / had, used for perfect tenses)';
 if(!tr){tip.innerHTML=`<b>${w}</b> = …looking it up`;try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=es|en');const j=await r.json();tr=cache[w]=j.responseData.translatedText}catch(_){tr='(no internet right now)'}}
 tip.innerHTML=`<b>${w}</b> = ${tr}`});
function showReveal(who){phase='reveal';phaseT=0;const d=cur.deep||['','',[],[]],[en,es,verbs,vocab]=d,R=$('reveal');
 const hs=new Set();(verbs||[]).forEach(v=>v[0].split(' ').forEach(x=>hs.add(norm(x))));(es||'').replace(/\*(.+?)\*/g,(m,x)=>x.split(' ').forEach(y=>hs.add(norm(y))));const hl=s=>wrap(s,hs);
 R.innerHTML=`<button class="x" onclick="closeReveal()" title="Close">✕</button><h2>${who?`✅ <span style="color:${who.dark}">${who.name}</span> got it!`:'⏰ Time ran out'}</h2>

 ${verbs&&verbs.length?`<div class="lbl">Verbs</div>${verbs.map(v=>{const c=tagClass(v[2]);return`<div class="verb"><mark>${v[0]}</mark> = ${v[4]} · from <b>${v[1]}</b> <span class="tag ${c}">${v[2]}</span>${TENSE_PLAIN[c]?`<div class="small">${v[2]} = ${TENSE_PLAIN[c]}</div>`:''}</div>`}).join('')}`:''}
 ${vocab&&vocab.length?`<div class="lbl">Words</div><div>${vocab.map(v=>`<span class="chip"><b>${v[0]}</b> = ${v[1]}</span>`).join('')}</div>`:''}
 <button class="go" onclick="closeReveal()">Next question ▶</button><div class="small">Click any word to see what it means. Close with ✕ or press Enter.</div>`;

function openCrate(p,c){c.alive=false;c.t=20*FPS;phase='crate';let q;
 if(c.type==='p')q=genConj();else{const all=L1.concat(L2,HARD).filter(x=>!cur||x[0]!==cur.q),x=all[Math.random()*all.length|0];q={q:x[0],opts:[x[1][x[2]],...x[1].filter((o,i)=>i!==x[2])],a:0,ex:x[3]}}
 const order=shuf([0,1,2,3]);crateQ={p,c,q,order,done:false};const R=$('reveal');
 R.innerHTML=`<h2>${c.type==='p'?'⭐':'📦'} <span style="color:${p.dark}">${p.name}</span> found a ${c.type==='p'?'power-up star':'question crate'}</h2>
 <div class="small">${c.type==='p'?'Conjugate the verb right to get a random power-up.':'Answer right to get 🛡 armor, full health, and ammo.'} Click an answer or press 1–4.</div>
 <div class="lbl">Question</div><div class="q" style="font-size:1.3rem">${wrap(q.q)}</div>
 <div id="copts">${order.map((o,k)=>`<button class="opt" style="background:${COLORS[k]}" onclick="answerCrate(${k})">${k+1}) ${q.opts[o]}</button>`).join('')}</div><div id="cres"></div>`;
 R.style.display='block';R.scrollTop=0;$('dim').style.display='block';shownAt=Date.now()}
function answerCrate(k){if(!crateQ||crateQ.done)return;crateQ.done=true;const{p,c,q,order}=crateQ,ok=order[k]===q.a;let reward='';
 if(ok){if(c.type==='p'){const pw=POWERS[Math.random()*POWERS.length|0];pw.f(p);reward=pw.n}else{p.armor=Math.min(100,p.armor+50);p.hp=100;p.ammo+=4;reward='🛡 +50 armor, full health, +4 ammo'}p.score+=50;toast(`${p.name}: ${reward}`,p.color)}else p.score-=25;
 document.querySelectorAll('#copts .opt').forEach((b,i)=>{b.disabled=true;b.style.opacity=order[i]===q.a?1:.35;if(order[i]===q.a)b.style.outline='4px solid #1b2030'});
 $('cres').innerHTML=`<div class="ans ${ok?'':'bad'}">${ok?'✅ Correct! You got: '+reward:'❌ Not quite (−25). The answer was: '+q.opts[q.a]}</div><div class="lbl">Why</div><div>${q.ex}</div>
 <button class="go" onclick="closeCrate()">Back to the fight ▶</button><div class="small">Press Enter to continue.</div>`;shownAt=Date.now()}
const plain=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function openChest(p,c){c.alive=false;c.t=25*FPS;phase='crate';const g=genConj();crateQ={p,c,g,typed:true,done:false,hints:0};const R=$('reveal'),T=TENSES[g.t];

 const inp=$('tin');inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')checkTyped()});for(const k in keys)keys[k]=false;setTimeout(()=>inp.focus(),30)}
function hintTyped(){const q=crateQ;if(!q||q.done)return;q.hints++;const g=q.g;

function checkTyped(){const q=crateQ;if(!q||q.done)return;const val=$('tin').value;if(!val.trim())return;q.done=true;const g=q.g,p=q.p;
 const exact=val.trim().toLowerCase().replace(/\s+/g,' ')===g.right,ok=exact||plain(val)===plain(g.right);let reward='';
 if(ok){const ks=Object.keys(GUNS),k=ks[Math.random()*ks.length|0];p.gun={...GUNS[k]};p.armor=Math.min(100,p.armor+25);p.score+=100-q.hints*25;reward=`${GUNS[k].e} ${GUNS[k].n} + 🛡25 armor`;toast(`${p.name}: ${reward}`,p.color)}else p.score-=25;

 <div class="lbl">Why</div><div>${g.ex}</div><button class="go" onclick="closeCrate()">Back to the fight ▶</button><div class="small">Press Enter to continue.</div>`;

function closeCrate(){if(phase!=='crate'||!crateQ||!crateQ.done)return;crateQ=null;hideReveal();tip.style.display='none';for(const k in pressed)delete pressed[k];for(const k in keys)keys[k]=false;phase='play'}

function burst(x,y,c,n=14,sp=9){if(parts.length>900)return;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*sp,vy:(Math.random()-.8)*sp,l:30+Math.random()*20,c,s:3+Math.random()*4})}
function floatText(x,y,t,c){floats.push({x,y,t,c,l:60})}
function hurt(p,dmg,by,why){if(p.inv>0||p.dead)return;if(p.shieldT>0){floatText(p.x+p.w/2,p.y-10,'✨ blocked','#fff');p.inv=20;return}
 if(p.armor>0){const a=Math.min(p.armor,dmg);p.armor-=a;dmg-=a;floatText(p.x+p.w/2,p.y-28,'🛡−'+a,'#7ad0ff');if(dmg<=0){p.inv=25;return}}
 p.hp-=dmg;floatText(p.x+p.w/2,p.y-10,'−'+dmg,'#ff5050');shake=Math.max(shake,6);if(p.hp<=0)ko(p,by,why);else p.inv=30}
function ko(p,by,why){if(p.dead)return;burst(p.x+p.w/2,Math.min(p.y+p.h/2,H-20),p.color,50,14);shake=14;
 if(by){by.score+=150;by.ko++;floatText(by.x+by.w/2,by.y-20,'+150 KO!',by.color);msg(`💥 <b style="color:${by.color}">${by.name}</b> KO'd <b style="color:${p.color}">${p.name}</b> (+150)`)}
 else{p.score-=50;msg(`${why||'🔺'} <b style="color:${p.color}">${p.name}</b> got wrecked (−50). Respawning in 3…`)}
 Object.assign(p,{dead:RESPAWN,vx:0,vy:0,stun:0,on:null})}
function respawn(p){const s=LV.spawns[players.indexOf(p)];Object.assign(p,{x:s[0],y:s[1],hp:100,inv:120,ammo:Math.max(p.ammo,2),cx:undefined});burst(p.x+p.w/2,p.y+p.h/2,'#fff',30,10)}
function killMob(m,by){m.hp=0;m.dead=m.t==='b'?-1:8*FPS;const boss=m.t==='b',pts=boss?300:30;burst(m.x+m.w/2,m.y+m.h/2,boss?'#ff3':'#c33',boss?80:25,boss?18:10);shake=boss?20:5;
 if(by){by.score+=pts;floatText(m.x+m.w/2,m.y-10,'+'+pts,by.color)}
 if(boss){msg(`😈 <b style="color:${by?by.color:'#fff'}">${by?by.name:'Someone'}</b> defeated ${m.name} (+300)`);if(mobs.filter(x=>x.t==='b').every(x=>x.dead))toast('ALL BOSSES DEFEATED 🏆','#ffd23f')}}
function hitMob(m,dm,by){if(m.dead)return;if(m.armor>0){if(dm>=2||(by&&by.megaT>0)){m.armor=Math.max(0,m.armor-dm);floatText(m.x+m.w/2,m.y-6,m.armor?'🛡−'+dm:'ARMOR BROKEN!','#7ad0ff')}else floatText(m.x+m.w/2,m.y-6,'🛡 clink','#aaa');return}
 m.hp-=dm;if(m.hp<=0)killMob(m,by);else floatText(m.x+m.w/2,m.y-6,'−'+dm,'#fff')}
function explode(s){burst(s.x,s.y,'#ff8a2a',40,14);burst(s.x,s.y,'#444',20,8);shake=Math.max(shake,10);const R=110,mega=s.o.megaT>0?2:1;
 for(const m of mobs)if(!m.dead&&Math.hypot(m.x+m.w/2-s.x,m.y+m.h/2-s.y)<R+m.w/2)hitMob(m,s.w.dmg*mega,s.o);
 for(const p of players)if(p!==s.o&&!p.dead&&Math.hypot(p.x+p.w/2-s.x,p.y+p.h/2-s.y)<R){p.vx+=Math.sign(p.x-s.x||1)*10;p.vy=-10;hurt(p,s.w.pdmg*mega,s.o,'💣')}}
const ease=(T,ph=0)=>.5-.5*Math.cos(2*Math.PI*(gt/T+ph));
function sawPos(s){if(s.rad){const a=2*Math.PI*(gt/s.T+(s.ph||0));return[s.cx+Math.cos(a)*s.rad,s.cy+Math.sin(a)*s.rad]}const k=ease(s.T,s.ph||0);return[s.x1+(s.x2-s.x1)*k,s.y1+(s.y2-s.y1)*k]}
function rockPos(r){const k=((gt/r.T+r.ph)%1+1)%1;if(k<.3)return{x:r.x,y:r.y0,warn:true};const f=(k-.3)/.7;return{x:r.x,y:r.y0+(r.y1-r.y0)*f*f,warn:false}}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const near=(p,o,r)=>{const dx=p.x+p.w/2-o.x,dy=p.y+p.h/2-o.y;return dx*dx+dy*dy<r*r};

function update(){
 phaseT++;tick++;
 if(phase!=='play')return;
 gt+=1/FPS;if(--qTimer<=0)return showReveal(null);
 for(const m of LV.movers){const k=ease(m.T),nx=m.x+m.ax*k,ny=m.y+m.ay*k;m.dx=m.cx===undefined?0:nx-m.cx;m.dy=m.cy===undefined?0:ny-m.cy;m.cx=nx;m.cy=ny}
 const solids=LV.plats.map(r=>({r,m:null})).concat(LV.movers.map(m=>({r:[m.cx,m.cy,m.w,22],m})));
 for(const p of players){const k=p.keys;
  if(p.dead>0){if(--p.dead===0)respawn(p);continue}
  if(p.on){p.x+=p.on.dx;p.y+=p.on.dy}
  if(p.inv>0)p.inv--;if(p.cd>0)p.cd--;if(p.lock>0)p.lock--;for(const b of['speedT','jumpT','megaT','shieldT'])if(p[b]>0)p[b]--;
  if(p.stun>0){p.stun--;p.vx*=.85}else{
   const dir=(keys[k.r]?1:0)-(keys[k.l]?1:0);p.vx+=dir*(p.speedT>0?1.7:1.1);p.vx*=.82;if(dir)p.face=dir;
   if(pressed[k.j]&&p.jumps<(p.jumpT>0?3:2)){p.vy=-13.5;p.jumps++;p.on=null;burst(p.x+p.w/2,p.y+p.h,'#ffffffaa',6,4)}
   if(pressed[k.f]&&p.cd<=0&&(p.gun||p.ammo>0))fire(p)}
  p.walk+=Math.abs(p.vx)*.15;
  p.vy=Math.min(p.vy+.65,16);p.x+=p.vx;
  if(p.x<0){p.x=0;p.vx=0}if(p.x+p.w>WWf()){p.x=WWf()-p.w;p.vx=0}
  const prevB=p.y+p.h;p.y+=p.vy;p.on=null;
  for(const{r:[px,py,pw],m}of solids){if(p.x+p.w>px&&p.x<px+pw&&p.vy>=0&&prevB<=py+2+(m?Math.abs(m.dy):0)&&p.y+p.h>=py){p.y=py-p.h;p.vy=0;p.jumps=0;p.on=m}}
  // launch pads
  for(const pd of LV.pads){if(p.x+p.w>pd[0]&&p.x<pd[0]+pd[2]&&p.y+p.h>=pd[1]-10&&p.y+p.h<=pd[1]+2&&p.vy>=0){p.vy=-23;p.jumps=1;p.on=null;pd.t=12;burst(pd[0]+pd[2]/2,pd[1]-8,'#ffd23f',16,8)}}
  for(const[sx,sy,sw]of LV.spikes){if(p.x+p.w>sx+4&&p.x<sx+sw-4&&p.y+p.h>sy-18&&p.y+p.h<=sy+6){
   if(sy>=H){ko(p,null,LV.dark?'🌋':'🔺');break}hurt(p,34,null,'🔺');if(!p.dead){p.vy=-12;p.jumps=1;p.stun=15}}}
  for(const[sx,sy,sw]of LV.ceil){if(p.x+p.w>sx+4&&p.x<sx+sw-4&&p.y<sy+20&&p.y>sy-30){hurt(p,30,null,'🔻');if(!p.dead){p.vy=6;p.y=sy+22}}}
  if(p.dead)continue;if(p.y>H+60){ko(p,null,'🔺');continue}
  for(const s of LV.saws){const[x,y]=sawPos(s);const dx=p.x+p.w/2-x,dy=p.y+p.h/2-y;if(dx*dx+dy*dy<(s.r+18)**2){hurt(p,30,null,'⚙️');if(!p.dead){p.vx=Math.sign(dx||1)*10;p.vy=-9;p.stun=20}}}
  for(const r of LV.rocks){const q=rockPos(r);if(!q.warn&&Math.abs(p.x+p.w/2-q.x)<26&&p.y<q.y+18&&p.y+p.h>q.y-18){hurt(p,30,null,'🪨');if(!p.dead){p.stun=20;p.vy=4}}}
  if(p.dead)continue;
  for(const m of mobs){if(m.dead)continue;if(!ov(p,m))continue;
   if(m.t!=='b'&&p.vy>0&&prevB<=m.y+10){killMob(m,p);p.vy=-11;p.jumps=1;continue}
   hurt(p,m.t==='b'?30:20,null,'👾');if(!p.dead){p.vx=Math.sign(p.x-m.x||1)*9;p.vy=-8;p.stun=18}}
  if(p.dead)continue;
  for(const g of guns)if(g.alive&&near(p,g,32)){g.alive=false;g.t=15*FPS;p.gun={...GUNS[g.type]};toast(`${p.name} picked up ${GUNS[g.type].e} ${GUNS[g.type].n}`,p.color);burst(g.x,g.y,'#fff',16)}
  for(const c of crates)if(c.alive&&near(p,c,34)){openCrate(p,c);for(const k in pressed)delete pressed[k];return}
  for(const c of chests)if(c.alive&&near(p,c,34)){openChest(p,c);for(const k in pressed)delete pressed[k];return}
  if(p.lock===0)for(const o of orbs){if(!o.alive||!near(p,o,38))continue;
   if(o.o===cur.a){const before=weaponOf(p);p.streak++;p.best=Math.max(p.best,p.streak);const after=weaponOf(p);if(after!==before){p.ammo+=5;toast(`${p.name}: ${p.streak} in a row!<br>${after.e} ${after.n} unlocked`,p.color)}
    p.score+=100;p.right++;p.ammo+=3;p.hp=Math.min(100,p.hp+40);burst(o.x,o.y,'#5f5',40,12);floatText(o.x,o.y-30,'+100','#5f5');orbs.forEach(x=>x.alive=false);showReveal(p);return}
   const lost=p.streak>=2;p.streak=0;if(lost)toast(`${p.name} lost their streak 💔`,'#ff7070');p.score-=50;p.lock=LOCK;p.stun=30;p.vy=-8;burst(o.x,o.y,'#f44',24);floatText(o.x,o.y-30,'−50 · 🔒10s','#ff5050');shake=8;
   msg(`<b style="color:${p.color}">${p.name}</b> grabbed the wrong one ❌ (${cur.opts[o.o]}). Locked out for 10 seconds.`);break}
 }
 for(const k in pressed)delete pressed[k];
 for(const pd of LV.pads)if(pd.t>0)pd.t--;
 // mobs
 const alive=players.filter(p=>!p.dead);
 for(const m of mobs){if(m.dead){if(m.dead>0&&--m.dead===0)Object.assign(m,mkMob(m,mobs.indexOf(m)));continue}
  if(m.t==='w'){m.x+=m.s*m.dir;if(m.x<m.min||m.x+m.w>m.max)m.dir*=-1;m.y=m.y0;m.anim+=.2}
  else if(m.t==='f'){m.x+=m.s*m.dir;if(m.x<0||m.x+m.w>WWf())m.dir*=-1;m.y=m.yb+Math.sin(gt*2.2+m.ph)*m.amp}
  else{m.x+=m.s*m.dir;if(m.x<m.min||m.x+m.w>m.max)m.dir*=-1;m.y=36+Math.sin(gt*1.5+m.min/400)*14;
   const nr=alive.filter(p=>Math.abs(p.x-m.x)<1000),low=m.hp<m.hpMax/2,bx=m.x+m.w/2,by=m.y+m.h;
   if(--m.cd<=0&&nr.length){
    if(m.ring&&Math.random()<.5){const n=low?14:9;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+gt;shots.push({x:bx,y:m.y+m.h/2,vx:Math.cos(a)*5,vy:Math.sin(a)*5,o:null,enemy:true,l:220})}}
    else{const t=nr[Math.random()*nr.length|0],ang=Math.atan2(t.y+20-by,t.x+17-bx),spread=m.hard?(low?[-.36,-.18,0,.18,.36]:[-.2,0,.2]):(low?[-.25,0,.25]:[0]);
     spread.forEach(a=>shots.push({x:bx,y:by,vx:Math.cos(a+ang)*(m.hard?7:6),vy:Math.sin(a+ang)*(m.hard?7:6),o:null,enemy:true,l:220}))}
    m.cd=m.hard?(low?55:85):(low?80:110)}}}
 for(const arr of[crates,chests,guns])for(const c of arr)if(!c.alive&&--c.t<=0)c.alive=true;

 for(const a of[crates,chests,guns])a.forEach(o=>{if(o.alive)L(o.x,o.y,80)});LV.torches.forEach(t=>L(t[0],t[1]-16,170+Math.sin(tick/5+t[0])*8));
 LV.spikes.forEach(([sx,sy,sw])=>{if(sy>=H)for(let x=sx+30;x<sx+sw;x+=70)L(x,705,110)});shots.forEach(s=>L(s.x,s.y,70));
 ctx.drawImage(darkC,0,0,vw,H,0,0,vw,H)}

 for(const o of orbs){if(!o.alive)continue;const sx=(o.x-c.x)*c.z,sy=(o.y-c.y)*c.z;if(sx>0&&sx<vw&&sy>0&&sy<H)continue;
  const ax=Math.max(22,Math.min(vw-22,sx)),ay=Math.max(70,Math.min(H-90,sy)),ang=Math.atan2(sy-ay,sx-ax);

  ctx.fillStyle='#fff';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(LET[o.k],ax,ay+1);ctx.textBaseline='alphabetic'}}
function drawCard(p,x,y,w){ctx.fillStyle='#0b1020d9';rr(x,y,w,58,12);ctx.fill();ctx.strokeStyle=p.color+'88';ctx.lineWidth=1.5;ctx.stroke();
 ctx.textAlign='left';ctx.fillStyle=p.color;ctx.font='900 14px system-ui';ctx.fillText(p.name,x+12,y+20);ctx.fillStyle='#e8ecf4';ctx.font='800 14px system-ui';ctx.textAlign='right';ctx.fillText(p.score+' pts',x+w-12,y+20);
 ctx.fillStyle='#ffffff18';rr(x+12,y+28,w-24,8,4);ctx.fill();ctx.fillStyle=p.hp>50?'#41d37e':p.hp>25?'#f5b544':'#e2403a';rr(x+12,y+28,(w-24)*Math.max(0,p.hp)/100,8,4);ctx.fill();
 if(p.armor>0){ctx.fillStyle='#7ad0ff';rr(x+12,y+28,(w-24)*p.armor/100,3,2);ctx.fill()}

function draw(){ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);if(!LV)return;
 const sp=split&&players.length>1,n=players.length,views=sp?players.map((p,i)=>({x0:Math.round(i*W/n),w:Math.round(W/n),p})):[{x0:0,w:W,p:null}];lowFx=sp&&n>2;
