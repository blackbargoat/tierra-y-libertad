*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2f3d;overflow:hidden;font-family:Pixel,monospace;color:#f4cca1;-webkit-font-smoothing:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center}
canvas{display:block;image-rendering:pixelated}
.hide{display:none!important}
/* question bar (battle) */
#qbar{position:absolute;left:0;right:0;top:0;background:#434a5f;border-bottom:4px solid #2b2f3d;padding:8px 16px 10px;z-index:3}
#qbar .q{font-size:42px;color:#fbf1e3;text-align:center;line-height:1.1}
#qbar .row{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap}
#qbar .a{display:flex;align-items:center;gap:6px;background:#2b2f3d;padding:2px 10px 2px 2px;font-size:32px;color:#f4cca1;max-width:300px}
#qbar .a i{font-style:normal;width:26px;height:26px;display:grid;place-items:center;color:#fbf1e3;font-size:36px}
#qbar .meta{position:absolute;right:14px;top:8px;font-size:36px;color:#f4ac66}
#qbar .meta.low{color:#d95763}
#qbar .lv{position:absolute;left:14px;top:8px;font-size:32px;color:#959ab1}
/* messages + objective */
#msg{position:absolute;left:50%;transform:translateX(-50%);top:auto;bottom:100px;font-size:36px;color:#fbf1e3;background:#2b2f3dcc;padding:4px 12px;z-index:3}
#obj{position:absolute;left:14px;top:14px;background:#434a5f;border:4px solid #2b2f3d;padding:8px 12px;font-size:24px;line-height:1.15;z-index:3;max-width:340px}
#obj .small{font-size:20px;color:#c2e3e8}
#obj .done{color:#959ab1;text-decoration:line-through}
#obj b{color:#f4ac66;font-weight:normal}
/* subtitles (cutscenes + talking) */
#sub{position:absolute;left:0;right:0;bottom:0;height:150px;background:#000;z-index:4;display:flex;gap:18px;align-items:center;padding:0 40px}
#sub canvas{width:96px;height:96px;background:#434a5f;border:4px solid #f4cca1;flex:none}
#sub .name{font-size:36px;color:#f4ac66}
#sub .es{font-size:55px;color:#fff;line-height:1.05;margin-top:2px}
#sub .en{font-size:32px;color:#959ab1;margin-top:6px}
#sub .next{position:absolute;right:20px;bottom:12px;font-size:29px;color:#5a627a}
#topbar{position:absolute;left:0;right:0;top:0;height:70px;background:#000;z-index:4}
/* black typewriter cards */
#card{position:absolute;inset:0;background:#000;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:60px;text-align:center}
#card .l .es{font-size:85px;color:#fff;min-height:1em}
#card .l .en{font-size:39px;color:#959ab1;margin-top:8px;min-height:1em}
#card .next{position:absolute;bottom:24px;right:30px;font-size:29px;color:#434a5f}
/* panels */
#dim{position:absolute;inset:0;background:#2b2f3dcc;z-index:7}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:860px;max-height:660px;overflow:auto;background:#434a5f;border:6px solid #2b2f3d;outline:4px solid #f4cca1;padding:22px 28px;z-index:8;font-size:39px;line-height:1.15;color:#fbf1e3}
#panel h2{font-family:Future,Pixel;font-weight:normal;font-size:49px;margin:0 0 10px;color:#f4ac66}
#panel .lbl{font-size:29px;color:#959ab1;margin-top:12px;letter-spacing:1px}
#panel .big{font-size:52px}
#panel .en{font-size:32px;color:#c2e3e8}
#panel .small{font-size:31px;color:#c2e3e8;margin-top:4px}
#panel .ok{background:#2eb082;color:#fbf1e3;padding:8px 12px;margin:6px 0;font-size:45px}
#panel .bad{background:#d95763;color:#fbf1e3;padding:8px 12px;margin:6px 0;font-size:39px}
.btn{font-family:Pixel,monospace;font-size:39px;border:4px solid #2b2f3d;background:#f4ac66;color:#2b2f3d;padding:6px 18px;cursor:pointer;margin:12px 8px 0 0}
.btn:hover{background:#fbc97b}.btn.alt{background:#5a627a;color:#fbf1e3}.btn.on{background:#2eb082;color:#fbf1e3}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:Pixel,monospace;font-size:39px;border:4px solid #2b2f3d;color:#fbf1e3;padding:4px 12px 4px 4px;margin:6px 0;cursor:pointer}
.opt i{font-style:normal;width:30px;height:30px;display:grid;place-items:center;background:#2b2f3d33}
.opt:disabled{cursor:default}
textarea,input[type=text]{width:100%;font-family:Pixel,monospace;font-size:42px;background:#fbf1e3;color:#2b2f3d;border:4px solid #2b2f3d;padding:8px;margin-top:8px}
.w{cursor:pointer;border-bottom:2px dotted #959ab1}.w:hover{background:#f4ac66;color:#2b2f3d}.w.hl{color:#f4ac66}
#tip{position:fixed;z-index:30;background:#2b2f3d;color:#fbf1e3;border:3px solid #f4cca1;padding:6px 10px;font-family:Pixel,monospace;font-size:36px;display:none;max-width:280px;pointer-events:none}
#tip b{color:#f4ac66;font-weight:normal}
.grid{display:grid;gap:10px}
.cols{display:flex;gap:16px}
.selcol{flex:1;background:#2b2f3d;border:4px solid #2b2f3d;padding:10px;text-align:center}
.selcol canvas{display:block;margin:6px auto;width:160px;height:200px;background:#5a627a}
.chap{display:flex;justify-content:space-between;align-items:center;background:#2b2f3d;padding:8px 14px;margin:6px 0;cursor:pointer;font-size:39px}
.chap:hover{background:#5a627a}.chap.lock{opacity:.4;cursor:default}
#settings{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:900px;max-height:690px;overflow:auto;background:#434a5f;border:6px solid #2b2f3d;outline:4px solid #f4ac66;padding:20px 28px;z-index:20;font-size:30px;color:#fbf1e3;box-shadow:0 0 0 2000px rgba(43,47,61,.75)}
#settings h2{font-family:Future,Pixel;font-weight:normal;font-size:38px;margin:0 0 6px;color:#f4ac66}
#settings .lbl{font-size:24px;color:#959ab1;margin-top:14px}
